name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject API-key-shaped literals
        shell: bash
        run: |
          if matches="$(git grep -n -E -- 'sk-[A-Za-z0-9]{20,}' -- . 2>/dev/null)"; then
            printf '%s\n' "API-key-shaped literal found:" "$matches"
            exit 1
          fi
      - name: Reject machine-specific QQ paths
        shell: bash
        run: |
          if matches="$(git grep -n -E -- '[A-Za-z]:[/\\\\].*(Tencent[[:space:]]+Files|nt_qq)[/\\\\]|nt_qq[/\\\\]' -- . ':(exclude).github/workflows/ci.yml' 2>/dev/null)"; then
            printf '%s\n' "Machine-specific QQ path found:" "$matches"
            exit 1
          fi
      - name: Reject private dataset and runtime artifacts
        shell: bash
        run: |
          if matches="$(git ls-files | grep -E '(^|/)(datasets/work/|.*\.(db|sqlite|onnx|pt|pth|safetensors)$)')"; then
            printf '%s\n' "Private/local artifact is tracked:" "$matches"
            exit 1
          fi
      - name: Reject removed training runtime chain
        shell: bash
        run: |
          if matches="$(git grep -n -I -E -- 'DeepSeek|ONNX|onnxruntime|PyTorch|WinML|labeler|training' -- 'apps/**' 'tools/**' 2>/dev/null)"; then
            printf '%s\n' "Removed training/cloud runtime chain found:" "$matches"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm typecheck
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      # OpenCV is an opt-in native backend. The portable default gate must not
      # silently require a machine-specific OpenCV/Clang installation.
      - run: cargo clippy --all-targets -- -D warnings

  rust-windows-storage:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings

  rust-windows-opencv:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    env:
      OPENCV_VERSION: 4.13.0
      OPENCV_SHA256: f0e98c302464d6860777a7015065e11b9b271b5394e6ba92663f0cf1fc303f2c
      LLVM_VERSION: 20.1.8
      LLVM_SHA256: 3197846a2b19063687dd56e93e34cd941e3548d907f23a6131571321bdf9fe7b
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Download and configure pinned native dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nativeRoot = Join-Path $env:RUNNER_TEMP 'nlnf-native'
          New-Item -ItemType Directory -Path $nativeRoot -Force | Out-Null

          $opencvArchive = Join-Path $nativeRoot "opencv-$env:OPENCV_VERSION-windows.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/opencv/opencv/releases/download/$env:OPENCV_VERSION/opencv-$env:OPENCV_VERSION-windows.exe" `
            -OutFile $opencvArchive
          $opencvHash = (Get-FileHash -LiteralPath $opencvArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($opencvHash -ne $env:OPENCV_SHA256) {
            throw "OpenCV SHA-256 mismatch: expected $env:OPENCV_SHA256, got $opencvHash"
          }
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if ([string]::IsNullOrWhiteSpace($sevenZip)) {
            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          }
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw "7-Zip was not found on the hosted runner: $sevenZip"
          }
          $opencvExtractRoot = Join-Path $nativeRoot 'opencv-extract'
          & $sevenZip x $opencvArchive "-o$opencvExtractRoot" -y | Out-Host
          $opencvDir = Join-Path $opencvExtractRoot 'opencv\build'
          $opencvHeader = Join-Path $opencvDir 'include\opencv2\core.hpp'
          $opencvLibrary = Join-Path $opencvDir 'x64\vc16\lib\opencv_world4130.lib'
          if (-not (Test-Path -LiteralPath $opencvHeader -PathType Leaf)) {
            throw "Pinned OpenCV headers were not found under $opencvDir"
          }
          if (-not (Test-Path -LiteralPath $opencvLibrary -PathType Leaf)) {
            throw "Pinned OpenCV import library was not found: $opencvLibrary"
          }

          $llvmInstaller = Join-Path $nativeRoot "LLVM-$env:LLVM_VERSION-win64.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.exe" `
            -OutFile $llvmInstaller
          $llvmHash = (Get-FileHash -LiteralPath $llvmInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($llvmHash -ne $env:LLVM_SHA256) {
            throw "LLVM SHA-256 mismatch: expected $env:LLVM_SHA256, got $llvmHash"
          }
          $llvmDir = Join-Path $nativeRoot 'llvm'
          $installer = Start-Process -FilePath $llvmInstaller -ArgumentList @('/S', "/D=$llvmDir") -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            throw "Pinned LLVM installer failed with exit code $($installer.ExitCode)"
          }
          $llvmBin = Join-Path $llvmDir 'bin'
          $libclang = Join-Path $llvmBin 'libclang.dll'
          if (-not (Test-Path -LiteralPath $libclang -PathType Leaf)) {
            throw "Pinned LLVM libclang was not found: $libclang"
          }
          $opencvRuntime = Join-Path $opencvDir 'x64\vc16\bin\opencv_world4130.dll'
          if (-not (Test-Path -LiteralPath $opencvRuntime -PathType Leaf)) {
            throw "Pinned OpenCV runtime DLL was not found: $opencvRuntime"
          }
          $opencvRuntimeHash = (Get-FileHash -LiteralPath $opencvRuntime -Algorithm SHA256).Hash.ToLowerInvariant()

          @(
            "OPENCV_DIR=$opencvDir"
            "OPENCV_INCLUDE_PATHS=$(Join-Path $opencvDir 'include')"
            "OPENCV_LINK_PATHS=$(Join-Path $opencvDir 'x64\vc16\lib')"
            'OPENCV_WORLD_NAME=opencv_world4130'
            'OPENCV_LINK_LIBS=opencv_world4130'
            "OPENCV_RUNTIME_DIR=$(Join-Path $opencvDir 'x64\vc16\bin')"
            "LIBCLANG_PATH=$llvmBin"
            "CLANG_PATH=$(Join-Path $llvmBin 'clang.exe')"
            'NLNF_OPENCV_RUNTIME_NAME=opencv_world4130'
            "NLNF_OPENCV_RUNTIME_SHA256=$opencvRuntimeHash"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @(
            (Join-Path $opencvDir 'x64\vc16\bin')
            $llvmBin
          ) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Output "OpenCV $env:OPENCV_VERSION and LLVM $env:LLVM_VERSION configured."
      - run: cargo check --features opencv-backend
      - run: cargo test --features opencv-backend --all-targets -- --test-threads=1
      - run: cargo clippy --features opencv-backend --all-targets -- -D warnings
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install desktop dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Build and inspect the OpenCV NSIS bundle
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm --dir apps/desktop tauri:build:opencv

          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\src-tauri\target\release'
          $releaseExecutable = Join-Path $releaseDirectory 'nlnf-desktop.exe'
          $releaseRuntime = Join-Path $releaseDirectory 'opencv_world4130.dll'
          if (-not (Test-Path -LiteralPath $releaseExecutable -PathType Leaf)) {
            throw "OpenCV release executable was not produced: $releaseExecutable"
          }
          if (-not (Test-Path -LiteralPath $releaseRuntime -PathType Leaf)) {
            throw "OpenCV release runtime was not staged: $releaseRuntime"
          }
          $releaseRuntimeHash = (Get-FileHash -LiteralPath $releaseRuntime -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($releaseRuntimeHash -ne $env:NLNF_OPENCV_RUNTIME_SHA256) {
            throw "Staged OpenCV runtime SHA-256 mismatch: expected $env:NLNF_OPENCV_RUNTIME_SHA256, got $releaseRuntimeHash"
          }

          $nsisDirectory = Join-Path $releaseDirectory 'bundle\nsis'
          $installer = Get-ChildItem -LiteralPath $nsisDirectory -Filter '*.exe' -File |
            Where-Object { $_.Name -notlike 'uninstall*' } |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "OpenCV NSIS installer was not produced under $nsisDirectory"
          }
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if ([string]::IsNullOrWhiteSpace($sevenZip)) {
            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          }
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw "7-Zip was not found for NSIS resource inspection: $sevenZip"
          }
          $archiveListing = (& $sevenZip l $installer.FullName | Out-String)
          if ($LASTEXITCODE -ne 0 -or $archiveListing -notmatch 'nlnf-desktop\.exe') {
            throw "The NSIS bundle does not contain nlnf-desktop.exe: $($installer.FullName)"
          }
          if ($archiveListing -notmatch 'opencv_world4130\.dll') {
            throw "The NSIS bundle does not contain opencv_world4130.dll: $($installer.FullName)"
          }
          Write-Output "Verified $($installer.Name), nlnf-desktop.exe and opencv_world4130.dll (runtime SHA-256 $releaseRuntimeHash)."
      - name: Upload validated OpenCV Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: nlnf-windows-opencv-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/nlnf-desktop.exe
            apps/desktop/src-tauri/target/release/opencv_world4130.dll
          if-no-files-found: error
          retention-days: 14
      - name: Restore Tauri-generated manifest changes before release test
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = 'apps/desktop/src-tauri/Cargo.toml'
          $trackedChanges = @(git diff --name-only HEAD)
          $untrackedChanges = @(git ls-files --others --exclude-standard)
          $allChanges = @($trackedChanges + $untrackedChanges | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $unexpectedChanges = @($allChanges | Where-Object { $_ -ne $manifest })
          if ($unexpectedChanges.Count -gt 0) {
            throw "Unexpected changes remain after the ordinary Tauri build: $($unexpectedChanges -join ', ')"
          }
          if ($trackedChanges -contains $manifest) {
            git -c core.autocrlf=false restore --source=HEAD --staged --worktree -- $manifest
          }
          $remainingChanges = @(git status --porcelain=v1 --untracked-files=all)
          if ($remainingChanges.Count -gt 0) {
            throw "The checkout is not clean after restoring the Tauri manifest: $($remainingChanges -join '; ')"
          }
          Write-Output 'Restored the known Tauri manifest rewrite; the release test starts from a clean checkout.'
      - name: Test auto-recall release plumbing with a synthetic certificate
        shell: pwsh
        working-directory: .
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/validation/test-auto-recall-release-plumbing.ps1

  desktop-windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop tauri:build
